name: Build Android APK

# Builds a debug APK on GitHub's runners (which already include the Android SDK),
# so no PC or Android Studio is needed. Runs on every push and can also be
# started by hand from the Actions tab ("Run workflow").

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate web assets
        run: |
          set -e
          for f in android/app/src/main/assets/www/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/css/app.css
          echo "Web assets look good."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
