name: Web tests

# Headless tests for the web layer, independent of the APK build.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run headless web tests
        working-directory: tests
        run: npm test
